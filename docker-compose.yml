version: '3.8'

services:
  antiscroll:
    container_name: antiscroll
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:////data/antiscroll.db
      - ARTICLES_DIR=/data/articles
      - STATIC_DIR=/app/static
    volumes:
      - antiscroll_data:/data
    restart: unless-stopped

volumes:
  antiscroll_data:
